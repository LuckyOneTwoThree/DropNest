name: 💡 功能建议 (Feature Request)
description: 为 DropNest 提出新功能或改进建议
title: "[Feature] 简要描述你的建议"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！好的建议通常包含「痛点 + 方案」。请尽量具体。

  - type: textarea
    id: problem
    attributes:
      label: ❗ 你想解决的问题
      description: 这个功能的出发点是解决什么痛点？现有功能为何不够用？
      placeholder: 例如：目前剪贴板历史只支持纯文本，希望也能预览图片缩略图。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: ❗ 期望的方案
      description: 你希望如何实现 / 呈现这个功能？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式或替代方案？
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充背景
      description: 截图、参考链接、使用场景等任何有助于理解的信息。
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认这不是重复建议
          required: true
        - label: 我了解 DropNest 是 boring.notch 的精简派生版，建议符合其聚焦核心场景的定位
          required: false
